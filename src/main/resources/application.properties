spring.application.name=marketplace

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.profiles.active=local
app.jwt.secret=${JWT_SECRET_KEY}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
app.init.admin.password=${ADMIN_PASSWORD}
app.init.admin.firstName=${ADMIN_FIRST_NAME}
app.init.admin.lastName=${ADMIN_LAST_NAME}
app.init.admin.email=${ADMIN_EMAIL}